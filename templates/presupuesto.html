{% extends "base.html" %}
{% block content %}

<div style="text-align: center;">
  <h1 class="section-title">Create your own budget!</h1>
</div>

<form id="budget-form" class="budget-form">
  {% for flavor in ['Beyond Beef', 'Mushrooms & Leeks', 'Gruyere Cheese & Onions', 'Spicy Corn', 'Spinach & Feta'] %}
  <div class="budget-entry">
    <label>{{ flavor }}</label>
    <button type="button" onclick="changeQuantity('{{ flavor }}', -1)">−</button>
    <span id="{{ flavor }}-count" class="quantity-display">0</span>
    <button type="button" onclick="changeQuantity('{{ flavor }}', 1)">+</button>
  </div>
  {% endfor %}

  <button type="button" onclick="addSelectedItems()" class="add-button">Add Selected to Budget</button>
</form>

<table id="budget-table">
  <thead>
    <tr>
      <th>Flavor</th>
      <th>Quantity</th>
      <th>Subtotal</th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<h3 style="text-align:center;">Total: $<span id="total">0.00</span></h3>

<div style="text-align: center; margin-top: 20px;">
  <a href="#" id="download-csv" class="home-button" onclick="downloadCSV()">Download</a>
</div>

<script>
const unitPrice = 1.5;
let budgetItems = [];
const quantities = {
  "Beyond Beef": 0,
  "Mushrooms & Leeks": 0,
  "Gruyere Cheese & Onions": 0,
  "Spicy Corn": 0,
  "Spinach & Feta": 0
};

function changeQuantity(flavor, change) {
  quantities[flavor] = Math.max(0, quantities[flavor] + change);
  document.getElementById(`${flavor}-count`).textContent = quantities[flavor];
}

function addSelectedItems() {
  for (const flavor in quantities) {
    const quantity = quantities[flavor];
    if (quantity > 0) {
      const subtotal = unitPrice * quantity;
      budgetItems.push({ flavor, quantity, subtotal });
      quantities[flavor] = 0;
      document.getElementById(`${flavor}-count`).textContent = 0;
    }
  }
  updateTable();
}

function removeItem(index) {
  budgetItems.splice(index, 1);
  updateTable();
}

function updateTable() {
  const tbody = document.querySelector('#budget-table tbody');
  tbody.innerHTML = '';
  let total = 0;
  budgetItems.forEach((item, index) => {
    const row = document.createElement('tr');
    row.innerHTML = `
      <td>${item.flavor}</td>
      <td>${item.quantity}</td>
      <td>$${item.subtotal.toFixed(2)}</td>
      <td><button type="button" onclick="removeItem(${index})">Delete</button></td>
    `;
    tbody.appendChild(row);
    total += item.subtotal;
  });
  document.getElementById('total').textContent = total.toFixed(2);
}

function downloadCSV() {
  let csv = 'Flavor,Quantity,Subtotal\n';
  budgetItems.forEach(item => {
    csv += `${item.flavor},${item.quantity},$${item.subtotal.toFixed(2)}\n`;
  });
  csv += `,,Total: $${document.getElementById('total').textContent}`;
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = 'empanada_budget.csv';
  link.click();
}
</script>

{% endblock %}

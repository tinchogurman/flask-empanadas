{% extends "base.html" %}
{% block content %}

<div style="text-align: center;">
  <h1 class="section-title">Create your own budget!</h1>
</div>

<form id="budget-form" style="text-align: center;">
  <div class="quantity-controls">
    <span>Beyond Beef</span>
    <button type="button" onclick="changeQuantity('Beyond Beef', -1)">−</button>
    <span id="Beyond Beef-count" class="quantity-number">0</span>
    <button type="button" onclick="changeQuantity('Beyond Beef', 1)">+</button>
  </div>

  <div class="quantity-controls">
    <span>Mushrooms & Leeks</span>
    <button type="button" onclick="changeQuantity('Mushrooms & Leeks', -1)">−</button>
    <span id="Mushrooms & Leeks-count" class="quantity-number">0</span>
    <button type="button" onclick="changeQuantity('Mushrooms & Leeks', 1)">+</button>
  </div>

  <div class="quantity-controls">
    <span>Gruyere Cheese & Onions</span>
    <button type="button" onclick="changeQuantity('Gruyere Cheese & Onions', -1)">−</button>
    <span id="Gruyere Cheese & Onions-count" class="quantity-number">0</span>
    <button type="button" onclick="changeQuantity('Gruyere Cheese & Onions', 1)">+</button>
  </div>

  <div class="quantity-controls">
    <span>Spicy Corn</span>
    <button type="button" onclick="changeQuantity('Spicy Corn', -1)">−</button>
    <span id="Spicy Corn-count" class="quantity-number">0</span>
    <button type="button" onclick="changeQuantity('Spicy Corn', 1)">+</button>
  </div>

  <div class="quantity-controls">
    <span>Spinach & Feta</span>
    <button type="button" onclick="changeQuantity('Spinach & Feta', -1)">−</button>
    <span id="Spinach & Feta-count" class="quantity-number">0</span>
    <button type="button" onclick="changeQuantity('Spinach & Feta', 1)">+</button>
  </div>

  <button type="button" onclick="addSelectedItems()" style="margin-top: 20px;">Add Selected to Budget</button>
</form>

<table id="budget-table">
  <thead>
    <tr>
      <th>Flavor</th>
      <th>Quantity</th>
      <th>Subtotal</th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<h3>Total: $<span id="total">0.00</span></h3>

<div style="text-align: center; margin-top: 20px;">
  <a href="#" id="download-csv" class="home-button" onclick="downloadCSV()">Download</a>
</div>

<script>
const unitPrice = 1.5;
let budgetItems = [];
const quantities = {
  "Beyond Beef": 0,
  "Mushrooms & Leeks": 0,
  "Gruyere Cheese & Onions": 0,
  "Spicy Corn": 0,
  "Spinach & Feta": 0
};

function changeQuantity(flavor, change) {
  quantities[flavor] = Math.max(0, quantities[flavor] + change);
  document.getElementById(`${flavor}-count`).textContent = quantities[flavor];
}

function addSelectedItems() {
  for (const flavor in quantities) {
    const quantity = quantities[flavor];
    if (quantity > 0) {
      const subtotal = unitPrice * quantity;
      budgetItems.push({ flavor, quantity, subtotal });
      quantities[flavor] = 0;
      document.getElementById(`${flavor}-count`).textContent = 0;
    }
  }
  updateTable();
}

function removeItem(index) {
  budgetItems.splice(index, 1);
  updateTable();
}

function updateTable() {
  const tbody = document.querySelector('#budget-table tbody');
  tbody.innerHTML = '';
  let total = 0;
  budgetItems.forEach((item, index) => {
    const row = document.createElement('tr');
    row.innerHTML = `
      <td>${item.flavor}</td>
      <td>${item.quantity}</td>
      <td>$${item.subtotal.toFixed(2)}</td>
      <td><button type="button" onclick="removeItem(${index})">Delete</button></td>
    `;
    tbody.appendChild(row);
    total += item.subtotal;
  });
  document.getElementById('total').textContent = total.toFixed(2);
}

function downloadCSV() {
  let csv = 'Flavor,Quantity,Subtotal\n';
  budgetItems.forEach(item => {
    csv += `${item.flavor},${item.quantity},$${item.subtotal.toFixed(2)}\n`;
  });
  csv += `,,Total: $${document.getElementById('total').textContent}`;

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = 'empanada_budget.csv';
  link.click();
}
</script>

{% endblock %}

{% extends "base.html" %}
{% block content %}

<div style="text-align: center;">
  <h1 class="section-title">Create your own budget!</h1>
</div>

<div class="budget-control">
  {% for flavor in ["Beyond Beef", "Mushrooms & Leeks", "Gruyere Cheese & Onions", "Spicy Corn", "Spinach & Feta"] %}
  <div class="flavor-row">
    <span class="flavor-name">{{ flavor }}</span>
    <div class="quantity-buttons">
      <button type="button" onclick="modifyItem('{{ flavor }}', -1)">−</button>
      <span id="count-{{ flavor }}">0</span>
      <button type="button" onclick="modifyItem('{{ flavor }}', 1)">+</button>
    </div>
  </div>
  {% endfor %}
</div>

<table id="budget-table">
  <thead>
    <tr>
      <th>Flavor</th>
      <th>Quantity</th>
      <th>Subtotal</th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<h3>Total: $<span id="total">0.00</span></h3>

<div style="text-align: center; margin-top: 20px;">
  <a href="#" id="download-csv" class="home-button" onclick="downloadCSV()">Download</a>
</div>

<script>
const unitPrice = 1.5;
let budgetItems = [];

function modifyItem(flavor, delta) {
  let item = budgetItems.find(i => i.flavor === flavor);
  if (!item && delta > 0) {
    budgetItems.push({ flavor, quantity: 1, subtotal: unitPrice });
  } else if (item) {
    item.quantity += delta;
    if (item.quantity <= 0) {
      budgetItems = budgetItems.filter(i => i.flavor !== flavor);
    } else {
      item.subtotal = item.quantity * unitPrice;
    }
  }
  updateTable();
}

function removeItem(index) {
  budgetItems.splice(index, 1);
  updateTable();
}

function updateTable() {
  const tbody = document.querySelector('#budget-table tbody');
  tbody.innerHTML = '';
  let total = 0;
  budgetItems.forEach((item, index) => {
    document.getElementById(`count-${item.flavor}`).textContent = item.quantity;
    const row = document.createElement('tr');
    row.innerHTML = `
      <td>${item.flavor}</td>
      <td>${item.quantity}</td>
      <td>$${item.subtotal.toFixed(2)}</td>
      <td><button type="button" onclick="removeItem(${index})">Delete</button></td>
    `;
    tbody.appendChild(row);
    total += item.subtotal;
  });
  document.getElementById('total').textContent = total.toFixed(2);
  // Clear counts for removed items
  const allFlavors = ["Beyond Beef", "Mushrooms & Leeks", "Gruyere Cheese & Onions", "Spicy Corn", "Spinach & Feta"];
  allFlavors.forEach(f => {
    if (!budgetItems.find(i => i.flavor === f)) {
      document.getElementById(`count-${f}`).textContent = '0';
    }
  });
}

function downloadCSV() {
  let csv = 'Flavor,Quantity,Subtotal\n';
  budgetItems.forEach(item => {
    csv += `${item.flavor},${item.quantity},$${item.subtotal.toFixed(2)}\n`;
  });
  csv += `,,Total: $${document.getElementById('total').textContent}`;

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = 'empanada_budget.csv';
  link.click();
}
</script>

{% endblock %}

{% extends "base.html" %}
{% block content %}

<div class="container">
    <h1>The winners</h1>
    {% if flavors %}
        <ul>
        {% for flavor, count in flavors %}
            <li>{{ flavor }} ({{ count }})</li>
        {% endfor %}
        </ul>
    {% else %}
        <p>No flavors submitted yet.</p>
    {% endif %}
    <a href="/" class="home-button">Back to Home</a>
</div>

{% endblock %}

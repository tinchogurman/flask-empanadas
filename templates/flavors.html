{% extends "base.html" %}
{% block content %}

<div class="container" style="text-align: center; max-width: 600px; margin: 0 auto; padding: 40px;">
    <h1 style="color: #034ea2; font-size: 32px;">🥟 Fan Favorites</h1>
    {% if flavors %}
        <ul style="list-style: none; padding: 0;">
        {% for flavor, count in flavors %}
            <li style="margin: 12px auto; background: #f0f8ff; border-radius: 8px; padding: 12px 20px; font-size: 18px; color: #333; max-width: 400px; box-shadow: 0 2px 8px rgba(0,0,0,0.08);">
                <strong style="color: #1a73e8;">{{ flavor }}</strong> — {{ count }} vote{{ 's' if count > 1 }}
            </li>
        {% endfor %}
        </ul>
    {% else %}
        <p style="font-size: 16px; color: #555;">No flavors submitted yet.</p>
    {% endif %}

    <a href="/" class="home-button" style="display: inline-block; margin-top: 30px; padding: 12px 24px; background-color: #0066cc; color: white; font-weight: bold; border-radius: 8px; text-decoration: none; transition: background-color 0.3s ease;">
        ← Back to Home
    </a>
</div>

{% endblock %}

<!DOCTYPE html>
<html>
<head>
    <title>Vote for your favorite flavor</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <!-- Logo superior -->
    <div class="logo-wrapper">
        <a href="/"><img src="{{ url_for('static', filename='images/logo.png') }}" alt="Eve's Logo"></a>
    </div>

    <div class="container">
        <h1>EVE’S EMPANADAS</h1>
        <p>Choose your favorite!</p>

        <a href="/" class="home-button">← Back to Home</a>

        <div class="gallery-row">
            {% for img in images %}
            <form method="POST" action="/submit" class="photo-form">
                <input type="hidden" name="flavor" value="{{ img.rsplit('.', 1)[0].replace('-', ' ') }}">
                <input type="image" src="{{ url_for('static', filename='images/empanadas/' + img) }}" alt="Empanada" />
            </form>
            {% endfor %}
        </div>
    </div>
</body>
</html>

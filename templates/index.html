{% extends "base.html" %}
{% block content %}

<h1 class="section-title" style="text-align: center;">Choose your favorite!</h1>

<div class="gallery-row">
    {% for img in images %}
    <form method="POST" action="/submit" class="photo-form">
        <input type="hidden" name="flavor" value="{{ img.rsplit('.', 1)[0].replace('-', ' ') }}">
        <input type="image" src="{{ url_for('static', filename='images/empanadas/' + img) }}" class="flavor-image" alt="Empanada">
    </form>
    {% endfor %}
</div>

{% endblock %}

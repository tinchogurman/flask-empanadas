<!DOCTYPE html>
<html>
<head>
    <title>Empanada Voting</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Choose your favorite!</h1>
        <p>Click on one to vote:</p>

        <div class="gallery">
            {% for img in images %}
            <form method="POST" action="/submit" class="photo">
                <input type="hidden" name="flavor" value="{{ img.rsplit('.', 1)[0].replace('-', ' ') }}">
                <input type="image" src="{{ url_for('static', filename='images/' + img) }}" alt="Vote" />
            </form>
            {% endfor %}
        </div>
    </div>
</body>
</html>

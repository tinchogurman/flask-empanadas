{% extends "base.html" %}
{% block content %}

<h1 class="centered-title">Choose your favorite!</h1>

<div class="gallery-row" style="display: flex; justify-content: center; gap: 24px; flex-wrap: nowrap; padding: 20px; background: none;">
    {% for img in images %}
    <form method="POST" action="/submit" class="photo-form" style="background: none; border: none; box-shadow: none;">
        <input type="hidden" name="flavor" value="{{ img.rsplit('.', 1)[0].replace('-', ' ') }}">
        <input type="image" src="{{ url_for('static', filename='images/empanadas/' + img) }}" alt="Empanada" style="width: 220px; height: auto; border-radius: 12px;">
    </form>
    {% endfor %}
</div>

{% endblock %}
